[project]
name = "gscachyo-theday"
version = "0.1.0"
description = ""
authors = [{ name = "G", email = "g@devnull.rip" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["ansible (>=13.7.0,<14.0.0)", "jinja2 (>=3.1.6,<4.0.0)"]

[tool.poetry]
package-mode = false

[tool.pytest]
xfail_strict = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
  "pytest (>=9.0.3,<10.0.0)",
  "pytest-bdd (>=8.1.0,<9.0.0)",
  "pytest-cov (>=7.1.0,<8.0.0)",
  "debugpy (>=1.8.20,<2.0.0)",
  "neovim (>=0.3.1,<0.4.0)",
]
