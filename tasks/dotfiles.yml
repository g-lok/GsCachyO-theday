---
- name: Copy dotfiles first round
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/dotfiles"
    dest: "~/"
    mode: preserve
    directory_mode: '0755'
  become_user: "{{ username }}"
  register: dotfirst

- name: Noctalia settings first round
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/noctalia-settings.j2"
    dest: "~/dotfiles/noctalia/.config/noctalia/settings.json"
    mode: '0644'
  become_user: "{{ username }}"
  when: dotfirst.changed
  register: noctaliafirst

- name: Stow dotfiles (ignore packages missing target dirs)
  ansible.builtin.shell:
    cmd: |
      for dir in ~/dotfiles/*/; do
        d=$(basename "$dir")
        stow --adopt -d ~/dotfiles -t ~ "$d" 2>/dev/null || true
      done
  register: dotstow
  changed_when: false

- name: Copy dotfiles final round
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/dotfiles"
    dest: "~/"
    mode: preserve
    directory_mode: '0755'
  become_user: "{{ username }}"

- name: Noctalia settings second round
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/noctalia-settings.j2"
    dest: "~/dotfiles/noctalia/.config/noctalia/settings.json"
    mode: '0644'
  become_user: "{{ username }}"
