---
username: "{{ lookup('env', 'USER') }}"
git_name: "my name"
git_email: "my@email.com"

# Security toggles
enable_sshd: false
fail2ban_log_path: /var/log/fail2ban.log
gpg_signing_key_pub: ""
gpg_signing_key_priv: ""

# Dotfile templates mapping
templated_dotfiles:
  - {
      src: "ghostty/.config/ghostty/config.j2",
      pkg: "ghostty",
      dest: ".config/ghostty/config",
    }
  - {
      src: "jj/.config/jj/config.toml.j2",
      pkg: "jj",
      dest: ".config/jj/config.toml",
    }
  - {
      src: "noctalia/.config/noctalia/settings.json.j2",
      pkg: "noctalia",
      dest: ".config/noctalia/settings.json",
    }

