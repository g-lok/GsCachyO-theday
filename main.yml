---
- name: Configure host.
  hosts: localhost
  gather_facts: true

  pre_tasks:
    - name: Pre-tasks for Opencode Integration
      include_vars: vault.yml
      failed_when: false
      tags: ["always"]

    - name: Include playbook configuration.
      include_vars: "{{ item }}"
      with_fileglob:
        - "{{ playbook_dir }}/config.yml"
      tags: ["always"]

    - name: Download Ansible requirements
      ansible.builtin.command: >
        ansible-galaxy install -r "requirements.yml"
      register: galaxy_output
      changed_when: "'was installed successfully' in galaxy_output.stdout"

  handlers:
    - name: restart fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        state: restarted
      become: true

    - name: restart sshd
      ansible.builtin.systemd:
        name: sshd
        state: restarted
      become: true

    - name: restart avahi-daemon
      ansible.builtin.systemd:
        name: avahi-daemon
        state: restarted
      become: true

  tasks:
    - name: Run the equivalent of "pacman -Syu" to update/upgrade
      community.general.pacman:
        update_cache: true
        upgrade: true
      become: true

    - name: Install pacman packages
      community.general.pacman:
        name: "{{ pacman_pkgs }}"
        state: present
        update_cache: true
      become: true
      register: pacman_packages

    - name: Allow wheel group to run pacman without password (required for AUR helpers)
      ansible.builtin.copy:
        dest: /etc/sudoers.d/10-wheel-pacman
        content: |
          %wheel ALL=(ALL) NOPASSWD: /usr/bin/pacman
        mode: '0440'
        owner: root
        group: root
        validate: /usr/sbin/visudo -c -f %s
      become: true

    - name: Install AUR packages
      kewlfft.aur.aur:
        name: "{{ yay_pkgs }}"
        state: present
        update_cache: false
      become: false
      become_user: "{{ username }}"
      when: pacman_packages.changed
      register: aur_packages

    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ username }}"
        groups: docker
        append: true
      become: true

    - name: Ensure fail2ban jail.d directory
      ansible.builtin.file:
        path: /etc/fail2ban/jail.d
        state: directory
        mode: '0755'
      become: true

    - name: Deploy fail2ban sshd jail
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/fail2ban/jail.d/sshd.local.j2"
        dest: /etc/fail2ban/jail.d/sshd.local
        mode: '0644'
      become: true
      notify: restart fail2ban

    - name: Deploy fail2ban recidive jail
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/fail2ban/jail.d/recidive.local.j2"
        dest: /etc/fail2ban/jail.d/recidive.local
        mode: '0644'
      become: true
      notify: restart fail2ban

    - name: Pre-touch fail2ban log file (avoids chicken-and-egg start failure)
      ansible.builtin.file:
        path: /var/log/fail2ban.log
        state: touch
        mode: '0640'
        owner: root
        group: adm
      become: true

    - name: Enable and start fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        enabled: true
        state: started
      become: true

    - name: Ensure sshd includes config drop-in directory
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^Include /etc/ssh/sshd_config.d/\\*\\.conf"
        line: "Include /etc/ssh/sshd_config.d/*.conf"
        create: true
        mode: '0644'
        owner: root
        group: root
      become: true
      notify: restart sshd

    - name: Harden sshd - disable keyboard-interactive auth
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/50-opencode.conf
        content: |
          KbdInteractiveAuthentication no
        mode: '0644'
        owner: root
        group: root
      become: true
      notify: restart sshd

    - name: Disable IPv6 in avahi-daemon
      ansible.builtin.lineinfile:
        path: /etc/avahi/avahi-daemon.conf
        regexp: "^#?use-ipv6="
        line: "use-ipv6=no"
        mode: '0644'
      become: true
      notify: restart avahi-daemon

    - name: Enable system services (docker, avahi)
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - docker
        - avahi-daemon
      become: true

    - name: Configure sshd (Security)
      ansible.builtin.systemd:
        name: sshd
        enabled: "{{ enable_sshd | default(false) }}"
        state: "{{ 'started' if enable_sshd | default(false) else 'stopped' }}"
        masked: "{{ not enable_sshd | default(false) }}"
      become: true

    - name: Install oh-my-zsh + plugins
      ansible.builtin.include_tasks: tasks/oh-my-zsh.yml

    - name: Install lazyvim
      ansible.builtin.include_tasks: tasks/lazyvim.yml

    - name: Glitch plymouth theme
      ansible.builtin.include_tasks: tasks/glitch-animation.yml

    - name: Slice login
      ansible.builtin.include_tasks: tasks/slice-login.yml

    - name: Dotfiles
      ansible.builtin.include_tasks: tasks/dotfiles.yml

    - name: Mise
      ansible.builtin.command:
        cmd: "mise install"
      changed_when: false
      environment:
        MISE_MINIMUM_RELEASE_AGE: "0s"

    - name: Poetry local venvs
      ansible.builtin.command:
        cmd: "poetry config virtualenvs.in-project true"
      changed_when: false

    - name: Init opam if not already initialized
      ansible.builtin.command:
        cmd: opam init --disable-sandboxing --no-setup -y
        creates: "{{ ansible_facts['user_dir'] }}/.opam"
      become_user: "{{ username }}"

    - name: Install choosenim and Nim (x86_64 only)
      ansible.builtin.shell:
        cmd: curl -fsSL https://nim-lang.org/choosenim/init.sh | sh -s -- -y
        creates: "{{ ansible_facts['user_dir'] }}/.nimble/bin/nim"
      become_user: "{{ username }}"
      when: ansible_facts['architecture'] == "x86_64"

    - name: Add nimble bin to system PATH via profile.d
      ansible.builtin.copy:
        dest: /etc/profile.d/nimble.sh
        content: |
          # Add Nimble bin dir to PATH if it exists
          if [ -d "$HOME/.nimble/bin" ]; then
            export PATH="$HOME/.nimble/bin:$PATH"
          fi
        mode: '0644'
        owner: root
        group: root
      become: true

    - name: Configure git user.name
      community.general.git_config:
        name: user.name
        value: '{{ git_name }}'
        scope: global

    - name: Configure git user.email
      community.general.git_config:
        name: user.email
        value: '{{ git_email }}'
        scope: global

    - name: Configure jujutsu
      ansible.builtin.shell: |
        jj config set --user user.name '{{ git_name }}'
        jj config set --user user.email '{{ git_email }}'
      changed_when: false

    - name: Import GPG signing key (if provided)
      ansible.builtin.shell:
        cmd: gpg --batch --import
        stdin: "{{ gpg_signing_key_priv }}"
      become_user: "{{ username }}"
      when: gpg_signing_key_priv is defined
      changed_when: false
      no_log: true

    - name: Set GPG signing key trust
      ansible.builtin.command:
        cmd: gpg --batch --yes --quick-set-trust {{ gpg_signing_key_pub }} ultimate
      become_user: "{{ username }}"
      when: gpg_signing_key_pub is defined
      register: gpg_trust
      changed_when: "'already set' not in gpg_trust.stderr"
      failed_when: false

    - name: Set up opencode skills
      ansible.builtin.include_tasks: tasks/opencode-skills.yml

    - name: My wallpaper
      ansible.builtin.copy:
        src: "files/victorian-wallpaper.jpg"
        dest: "~/Pictures/Wallpapers/victorian-wallpaper.jpg"
        mode: "0600"
      become_user: "{{ username }}"

    - name: Install gh dash
      ansible.builtin.command:
        cmd: "gh extension install dlvhdr/gh-dash"
        creates: "{{ ansible_facts['user_dir'] }}/.local/share/gh/extensions/gh-dash"
